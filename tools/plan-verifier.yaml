name: plan-verifier
description: Executes test verification commands and verifies test suite success evidence before task completion.
input_schema:
  type: object
  properties:
    verification_command:
      type: string
      description: Shell test command to run (e.g., 'npm test', 'pytest', 'cargo test').
    expected_exit_code:
      type: integer
      description: Anticipated process exit code.
      default: 0
    require_zero_failures:
      type: boolean
      description: Whether 0 test failures is mandatory to pass verification.
      default: true
  required:
    - verification_command
